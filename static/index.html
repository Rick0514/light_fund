<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金持仓管理</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script defer src="/static/app.js"></script>
    <script defer src="/static/alpine.min.js"></script>
</head>
<body>
    <main class="container" x-data="fundApp()" x-init="init()">
        <header>
            <hgroup>
                <h1>📊 基金持仓管理</h1>
                <p>自选基金 · 净值追踪</p>
            </hgroup>
        </header>

        <section class="add-fund-section">
            <form id="add-fund-form" @submit.prevent="addFund()">
                <fieldset role="group">
                    <input type="text" x-model="newFundCode" placeholder="输入基金代码，如 110003" :disabled="loading" required>
                    <button type="submit" :aria-busy="loading">
                        <span x-show="!loading">+ 添加自选</span>
                        <span x-show="loading">加载中...</span>
                    </button>
                </fieldset>
            </form>
            <template x-if="error"><p class="error-msg" x-text="error"></p></template>
            <template x-if="successMsg"><p class="success-msg" x-text="successMsg"></p></template>
        </section>

        <!-- 标签管理 -->
        <section class="tag-section" x-show="allTags.length > 0 || funds.length > 0">
            <div class="tag-bar">
                <span :class="{ active: activeTags.length === 0 }" class="tag-chip" @click="activeTags = []">全部</span>
                <template x-for="t in allTags" :key="t">
                    <span :class="{ active: activeTags.includes(t) }" class="tag-chip">
                        <span class="tag-text" @click="toggleTag(t)" x-text="t"></span>
                        <span class="tag-x" @click.stop="deleteTag(t)" title="删除标签" x-show="allTags.length > 1">×</span>
                    </span>
                </template>
                <template x-if="showTagInput">
                    <input type="text" x-model="newTagName" placeholder="标签名" size="8"
                        @blur="commitTag()" @keydown.escape="showTagInput = false; newTagName = ''"
                        @keydown.enter.prevent="commitTag()" />
                </template>
                <template x-if="!showTagInput">
                    <span class="tag-chip add-tag" @click="showTagInput = true; $nextTick(() => $refs.tagInput?.focus())">+</span>
                </template>
            </div>
        </section>

        <template x-if="funds.length > 0">
            <section>
                <div class="list-header">
                    <h2>自选基金列表</h2>
                    <button class="outline small" @click="refreshValuation()" :aria-busy="refreshing">
                        <span x-show="!refreshing">🔄 刷新估值</span>
                        <span x-show="refreshing">刷新中...</span>
                    </button>
                </div>
                <p x-show="valTime" class="val-time" x-text="'估值更新时间: ' + valTime"></p>
                <div class="fund-grid">
                    <template x-for="fund in filteredFunds" :key="fund.fund_code">
                        <article class="fund-card">
                            <header>
                                <strong x-text="fund.fund_code"></strong>
                                <span class="fund-name" x-text="fund.name"></span>
                                <button class="outline secondary small delete-btn" @click="deleteFund(fund.fund_code)">删除</button>
                            </header>

                            <!-- 标签 -->
                            <div class="fund-tags">
                                <template x-for="t in fund.tags" :key="t">
                                    <span class="tag-chip small has-remove" @click="activeTags = [t]">
                                        <span x-text="t"></span>
                                        <span class="tag-remove" @click.stop="removeTagFromFund(fund.fund_code, t)">×</span>
                                    </span>
                                </template>
                                <span class="tag-chip small add-tag" @click="showTagPicker === fund.fund_code ? (showTagPicker = null) : (showTagPicker = fund.fund_code)">+</span>

                                <template x-if="showTagPicker === fund.fund_code">
                                    <select x-model="pickedTag" @change="addTagToFund(fund.fund_code, pickedTag); showTagPicker = null" class="tag-picker" @click.stop @blur="showTagPicker = null">
                                        <option value="">选择标签...</option>
                                        <template x-for="t in availableTagsFor(fund)" :key="t">
                                            <option :value="t" x-text="t"></option>
                                        </template>
                                    </select>
                                </template>
                            </div>

                            <div class="fund-stats">
                                <div class="stat">
                                    <small>单位净值</small>
                                    <strong x-text="fund.nav?.toFixed(4) || '--'"></strong>
                                </div>
                                <div class="stat">
                                    <small>实时估值</small>
                                    <strong x-text="fund.valuation?.gsz || '--'" class="val-gsz"></strong>
                                </div>
                                <div class="stat">
                                    <small>实时涨幅</small>
                                    <strong :class="valuationCls(fund.valuation?.gszzl)" x-text="fmtValPct(fund.valuation?.gszzl)"></strong>
                                </div>
                                <div class="stat">
                                    <small>日涨跌</small>
                                    <strong :class="fund.daily_return >= 0 ? 'up' : 'down'" x-text="fmtPct(fund.daily_return)"></strong>
                                </div>
                                <div class="stat">
                                    <small>净值日期</small>
                                    <strong x-text="fund.nav_date || '--'"></strong>
                                </div>
                                <div class="stat">
                                    <small>累计投入</small>
                                    <strong x-text="'¥' + fmtNum(fund.total_invested || 0)"></strong>
                                </div>
                                <div class="stat">
                                    <small>当前市值</small>
                                    <strong x-text="'¥' + fmtNum(fund.current_value || 0)"></strong>
                                </div>
                                <div class="stat">
                                    <small>距上次操作</small>
                                    <strong :class="(fund.nav_change_since_last || 0) >= 0 ? 'up' : 'down'" x-text="fmtNavChange(fund.nav_change_since_last)"></strong>
                                </div>
                                <div class="stat">
                                    <small>持仓盈亏</small>
                                    <strong :class="(fund.profit || 0) >= 0 ? 'up' : 'down'" x-text="fmtProfit(fund.profit, fund.profit_pct)"></strong>
                                </div>
                            </div>

                            <footer>
                                <button class="outline small"
                                    @click="showPosCode === fund.fund_code ? (showPosCode = null) : openPositions(fund.fund_code)"
                                    x-text="showPosCode === fund.fund_code ? '收起操作 ▲' : '操作记录 ▼'">
                                </button>
                            </footer>

                            <template x-if="showPosCode === fund.fund_code">
                                <div class="positions-panel">
                                    <h4>操作记录</h4>
                                    <template x-if="posData && posData.positions.length > 0">
                                        <table class="positions-table">
                                            <thead>
                                                <tr>
                                                    <th>日期</th>
                                                    <th>类型</th>
                                                    <th>金额</th>
                                                    <th>净值</th>
                                                    <th>份额</th>
                                                    <th>备注</th>
                                                    <th></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template x-for="p in posData.positions" :key="p.id">
                                                    <tr>
                                                        <td x-text="p.date"></td>
                                                        <td>
                                                            <span class="op-badge" :class="p.type === 'sell' ? 'sell' : 'buy'" x-text="p.type === 'sell' ? '减仓' : '加仓'"></span>
                                                        </td>
                                                        <td x-text="'¥' + fmtNum(p.amount)"></td>
                                                        <td x-text="p.nav?.toFixed(4)"></td>
                                                        <td x-text="p.shares?.toFixed(2)"></td>
                                                        <td x-text="p.note || '--'"></td>
                                                        <td>
                                                            <button class="outline secondary small" @click="deletePosition(fund.fund_code, p.id)">删</button>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </template>
                                    <template x-if="!posData || posData.positions.length === 0">
                                        <p class="muted">暂无操作记录</p>
                                    </template>

                                    <template x-if="posData">
                                        <div class="summary-bar">
                                            <span>累计投入: <strong>¥<span x-text="fmtNum(posData.total_invested)"></span></strong></span>
                                            <span>累计份额: <strong x-text="posData.total_shares?.toFixed(2)"></strong></span>
                                            <span>当前市值: <strong>¥<span x-text="fmtNum(posData.current_value)"></span></strong></span>
                                            <span>盈亏: <strong :class="(posData.profit || 0) >= 0 ? 'up' : 'down'" x-text="'¥' + fmtNum(posData.profit)"></strong></span>
                                        </div>
                                    </template>

                                    <h4>新增操作</h4>
                                    <form @submit.prevent="addPosition(fund.fund_code)" class="position-form">
                                        <div class="type-toggle">
                                            <label>
                                                <input type="radio" name="op_type" value="buy" x-model="opType" checked>
                                                <span class="toggle-label buy-label">加仓</span>
                                            </label>
                                            <label>
                                                <input type="radio" name="op_type" value="sell" x-model="opType">
                                                <span class="toggle-label sell-label">减仓</span>
                                            </label>
                                        </div>
                                        <input type="date" x-model="posDate" required>
                                        <select x-model="posMode" class="pos-mode-select">
                                            <option value="amount">按金额</option>
                                            <option value="shares">按份额</option>
                                        </select>
                                        <input type="number" x-show="posMode === 'amount'" x-model="posAmount" placeholder="金额（元）" step="0.01" min="0.01">
                                        <input type="number" x-show="posMode === 'shares'" x-model="posShares" placeholder="份额" step="0.01" min="0.01">
                                        <input type="text" x-model="posNote" placeholder="备注（可选）">
                                        <button type="submit" :aria-busy="posLoading">提交</button>
                                    </form>
                                </div>
                            </template>
                        </article>
                    </template>
                </div>
            </section>
        </template>

        <template x-if="funds.length === 0 && !loadingFunds">
            <section class="empty-state">
                <p>👋 还没有自选基金，在上方输入基金代码开始添加。</p>
            </section>
        </template>

        <footer class="app-footer">
            <small>数据来源：东方财富 · 仅供参考</small>
        </footer>
    </main>
</body>
</html>
